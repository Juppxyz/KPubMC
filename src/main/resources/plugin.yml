name: KPubMC
version: '${project.version}'
main: xyz.jupp.minecraft.Main
api-version: '26.3'
description: "Offizielles Plugin für den KlotzscherPub Minecraft Server. (2025)"

# usage /<command>: the usage line Bukkit sends on "return false" repeats the typed label (e.g. /geld)
commands:
  money:
    aliases: [geld, schilling]
    usage: /<command>
  config:
  help:
    aliases: [hilfe]
    usage: /<command>
  slimechunk:
    aliases: [sc]
    usage: /<command>
  invites:
    aliases: [einladungen]
    usage: /<command>
  team:
  ranking:
  createshop:
  hover:
  head:
    aliases: [kopf]
    usage: /<command>
  warp:
  customItem:
  donate:
    aliases: [spenden]
    usage: /<command>
  spawn:
  rules:
    aliases: [regeln]
    usage: /<command>
  createbankier:
  spec:
  createjuweler:
  createdealer:
  enderchest:
    aliases: [ec]
    usage: /<command>
  createtpdealer:
  dummy:
  bestrafung:
  wanted:
  origin:
    aliases: [ursprung]
    usage: /<command>
  removechunk:
